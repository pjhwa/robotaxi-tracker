server {
    listen 443 ssl;
    # Replace YOUR_HOSTNAME with your Tailscale hostname (e.g. mymachine.tail1234.ts.net)
    ssl_certificate /etc/nginx/certs/jerrymacmini.local.crt;
    ssl_certificate_key /etc/nginx/certs/jerrymacmini.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
