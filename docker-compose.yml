services:
  scraper:
    build: ./scraper
    volumes:
      - robotaxi_db:/data
      - ./vapid:/vapid:ro
    environment:
      - DB_PATH=/data/robotaxi.db
      - VAPID_PRIVATE_KEY_PATH=/vapid/private_key.pem
      - VAPID_CLAIM_EMAIL=${VAPID_CLAIM_EMAIL}
    restart: unless-stopped
    depends_on: []

  api:
    build: ./api
    volumes:
      - robotaxi_db:/data
    environment:
      - DB_PATH=/data/robotaxi.db
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8443:443"
      - "4002:80"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  robotaxi_db:
