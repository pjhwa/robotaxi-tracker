services:
  scraper:
    build: ./scraper
    volumes:
      - robotaxi_db:/data
    environment:
      - DB_PATH=/data/robotaxi.db
    restart: unless-stopped
    depends_on: []

  api:
    build: ./api
    volumes:
      - robotaxi_db:/data
    environment:
      - DB_PATH=/data/robotaxi.db
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  robotaxi_db:
